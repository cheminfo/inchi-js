name: Deploy inchi-js on lactame.com

# Custom workflow (does not use zakodium/workflows lactame-deploy.yml)
# because that one derives the package name from the ROOT package.json —
# `inchi-monorepo` here — and passes no version. This repo publishes the
# nested `packages/inchi-js` workspace instead.

on:
  workflow_dispatch:
  push:
    tags:
      - 'inchi-js-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run tsc -w inchi-js
      - name: Read inchi-js version
        run: echo "INCHI_JS_VERSION=$(jq -r .version packages/inchi-js/package.json)" >> $GITHUB_ENV
      - uses: zakodium/lactame-action@v1
        with:
          token: ${{ secrets.LACTAME_TOKEN }}
          name: inchi-js
          version: ${{ env.INCHI_JS_VERSION }}
          folder: packages/inchi-js/lib
