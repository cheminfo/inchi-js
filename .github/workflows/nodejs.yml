name: Node.js CI

# Custom workflow (does not use the shared zakodium/workflows reusable)
# because the IUPAC InChI regression tests require the `vendor/inchi`
# git submodule, which the shared workflow does not initialize.
# `npm test` runs both workspaces — including the 4,190+ molfile → InChI
# regression cases against the TypeScript source and the bundled
# `lib/inchi-js.js` artifact — plus type-check, eslint and prettier
# across the whole repository.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
