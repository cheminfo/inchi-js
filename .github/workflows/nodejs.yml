name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  nodejs:
    # Documentation: https://github.com/zakodium/workflows#nodejs-ci
    uses: zakodium/workflows/.github/workflows/nodejs.yml@nodejs-v1
    with:
      lint-check-types: true
      # The IUPAC regression suites read their fixtures from `vendor/inchi`,
      # which the shared checkout does not fetch.
      test-setup-command: git -C "$GITHUB_WORKSPACE" submodule update --init --recursive
      # `test-bundle` re-runs the whole suite against the bundled `lib/`
      # artifact that ships to npm, and is what makes `npmPack.test.ts` run.
      # It goes first: it starts by wiping `coverage/`, which the run after
      # it rewrites for the upload.
      npm-test-command: npm run test-bundle && npm run test-only
