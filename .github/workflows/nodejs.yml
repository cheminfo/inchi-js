name: Node.js CI

# Custom workflow (does not use the shared zakodium/workflows reusable)
# because the IUPAC InChI regression tests require the `vendor/inchi`
# git submodule, which the shared workflow does not initialize.
# `npm test -w inchi-js` runs the full suite — including the 4,190+
# molfile → InChI regression cases — against both the TypeScript
# source and the bundled `lib/inchi-js.js` artifact.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test -w inchi-js
