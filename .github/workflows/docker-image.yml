name: Docker image

# The image serves the playground, the API and its documentation, so either
# component's release tag rebuilds it.
on:
  push:
    tags:
      - 'inchi.cheminfo.org-v*'
      - 'inchi-api-v*'
  workflow_dispatch:

jobs:
  docker:
    # Documentation: https://github.com/zakodium/workflows#docker-image
    uses: zakodium/workflows/.github/workflows/docker-image.yml@docker-image-v1
