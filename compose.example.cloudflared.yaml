# Cloudflare Tunnel deployment — no port published on the host.
#
# Cloudflare dashboard (https://dash.cloudflare.com):
#   Networking → Tunnels → Create a tunnel → Cloudflared connector →
#   copy the token into .env as TUNNEL_TOKEN=... → open the tunnel →
#   Published applications tab → add application with
#   Service = HTTP, URL = inchi-cheminfo-org:80, hostname = inchi.lactame.com.
#
# Copy this file to compose.yaml and run: docker compose up -d

services:
  inchi-cheminfo-org:
    image: ghcr.io/cheminfo/inchi:latest
    build: .
    container_name: inchi-cheminfo-org
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: inchi-cheminfo-org-cloudflared
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - inchi-cheminfo-org
