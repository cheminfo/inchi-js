services:
  inchi-cheminfo-org:
    image: ghcr.io/cheminfo/inchi:latest
    build: .
    container_name: inchi-cheminfo-org
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - '${PORT:-8080}:80'
    ulimits:
      core: 0
