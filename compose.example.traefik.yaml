services:
  inchi-cheminfo-org:
    image: ghcr.io/cheminfo/inchi:latest
    build: .
    container_name: inchi-cheminfo-org
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.inchi-cheminfo-org.rule=Host(`inchi.cheminfo.org`)'
      - 'traefik.http.routers.inchi-cheminfo-org.entrypoints=websecure'
      - 'traefik.http.routers.inchi-cheminfo-org.tls=true'
      - 'traefik.http.routers.inchi-cheminfo-org.tls.certresolver=letsencrypt'
      - 'traefik.http.services.inchi-cheminfo-org.loadbalancer.server.port=80'

networks:
  traefik:
    external: true
