# Traefik reverse-proxy deployment — no port published on the host.
# Requires a host running Traefik on an external Docker network
# named `traefik`, with a `websecure` entrypoint and a `letsencrypt`
# cert resolver. Adjust the Host(...) label below to your hostname.
#
# Select via COMPOSE_FILE=compose.traefik.yaml in .env, then: docker compose up -d

services:
  inchi-cheminfo-org:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/inchi}:${IMAGE_TAG:-latest}
    build: .
    container_name: inchi-cheminfo-org
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: 10523
    tmpfs:
      - /tmp
    ulimits:
      core: 0
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.inchi-cheminfo-org.rule=Host(`inchi.cheminfo.org`)'
      - 'traefik.http.routers.inchi-cheminfo-org.entrypoints=websecure'
      - 'traefik.http.routers.inchi-cheminfo-org.tls=true'
      - 'traefik.http.routers.inchi-cheminfo-org.tls.certresolver=letsencrypt'
      - 'traefik.http.services.inchi-cheminfo-org.loadbalancer.server.port=10523'

networks:
  traefik:
    external: true
